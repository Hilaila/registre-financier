<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Registre comptable SYSCOHADA en F CFA, verrouillé par empreinte digitale, scellé et surveillé par une IA autonome.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Registre">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Registre Financier Scellé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2A3990">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout : application de registre — colonne unique (max 980 px), en-tête collant, navigation basse fixe, feuilles modales montant depuis le bas. */
:root{
  --paper:#F2F4F9; --surface:#FFFFFF; --sunk:#E8ECF4; --ink:#121930; --muted:#59627D; --line:#D8DEEA;
  --indigo:#2A3990; --on-indigo:#FFFFFF; --indigo-soft:#E3E7F7;
  --ochre:#9C6410; --ochre-soft:#F6EAD3;
  --pos:#1A7045; --pos-soft:#DFF1E6; --neg:#AE2F2A; --neg-soft:#F7E1DF; --warn:#965800; --warn-soft:#FAEACD;
  --shadow:0 1px 2px rgba(18,25,48,.06),0 10px 28px rgba(18,25,48,.10);
  --scrim:rgba(18,25,48,.45);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px; --nav-h:66px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B0F1F; --surface:#131930; --sunk:#1A2140; --ink:#E6E9F3; --muted:#9AA2BD; --line:#283050;
    --indigo:#909DF2; --on-indigo:#0B0F1F; --indigo-soft:#1D2652;
    --ochre:#E3A84C; --ochre-soft:#3A2B10;
    --pos:#52C68D; --pos-soft:#10301F; --neg:#F37E76; --neg-soft:#3B1715; --warn:#ECB04A; --warn-soft:#3A2A0C;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B0F1F; --surface:#131930; --sunk:#1A2140; --ink:#E6E9F3; --muted:#9AA2BD; --line:#283050;
  --indigo:#909DF2; --on-indigo:#0B0F1F; --indigo-soft:#1D2652;
  --ochre:#E3A84C; --ochre-soft:#3A2B10;
  --pos:#52C68D; --pos-soft:#10301F; --neg:#F37E76; --neg-soft:#3B1715; --warn:#ECB04A; --warn-soft:#3A2A0C;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.45rem,4.6vw,2.05rem);font-weight:760}
h2{font-size:1.02rem;font-weight:720;letter-spacing:.01em}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:650}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{width:40px;height:40px;display:grid;place-items:center;flex:none}
.brand-mark svg{width:40px;height:40px;display:block}
.brand-txt{min-width:0}
.brand-name{font-family:var(--f-display);font-stretch:118%;font-weight:760;font-size:1rem;line-height:1.1}
.brand-sub{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:650;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.banner{max-width:980px;margin:12px auto 0;padding:10px 14px;border-radius:12px;background:var(--ochre-soft);font-size:.88rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.n{background:var(--neg-soft)}

/* Corps */
.main{max-width:980px;margin:0 auto;padding-block:18px calc(var(--nav-h) + 112px + env(safe-area-inset-bottom,0px));display:grid;gap:26px}
.blk{display:grid;gap:12px;min-width:0}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.link{background:none;border:0;padding:4px 0;color:var(--indigo);font-weight:650;font-size:.88rem}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px;min-width:0;align-content:start}
.tile-k{font-size:.78rem;color:var(--muted);font-weight:650}
.tile-v{font-family:var(--f-display);font-stretch:104%;font-weight:720;font-size:clamp(1.12rem,4.6vw,1.5rem);font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.tile-v small{font-family:var(--f-body);font-size:.68rem;font-weight:650;color:var(--muted);margin-left:5px;letter-spacing:.04em}
.tile.lead{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.tile.lead .tile-k,.tile.lead small{color:var(--on-indigo);opacity:.82}

.seal-line{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px dashed var(--ochre);background:var(--ochre-soft);font-size:.86rem;text-align:left;width:100%}
.seal-line svg{width:22px;height:22px;color:var(--ochre);flex:none}
.seal-line.bad{border-color:var(--neg);background:var(--neg-soft)}
.seal-line.bad svg{color:var(--neg)}

.alerts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.sev{width:10px;height:10px;border-radius:50%;margin-top:6px}
.sev.crit{background:var(--neg)} .sev.warn{background:var(--warn)} .sev.info{background:var(--indigo)} .sev.ok{background:var(--pos)}
.alert-t{font-weight:650;font-size:.92rem}
.alert-d{font-size:.84rem;color:var(--muted)}
.chev{color:var(--muted);font-size:1.2rem;line-height:1.1}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:650;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.e{background:var(--pos-soft);color:var(--pos)} .chip.s{background:var(--neg-soft);color:var(--neg)}
.chip.w{background:var(--warn-soft);color:var(--warn)} .chip.i{background:var(--indigo-soft);color:var(--indigo)} .chip.o{background:var(--ochre-soft);color:var(--ochre)}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:.86rem;min-width:540px}
.tbl th,.tbl td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650;background:var(--sunk)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.tbl td.num{font-family:var(--f-mono)}
.tbl tr.paid td{color:var(--muted)}

.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv>div{display:contents}
.kv dt,.kv dd{padding:10px 12px;border-bottom:1px solid var(--line);margin:0;min-width:0}
.kv dd{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.88rem;overflow-wrap:anywhere}
.kv dd.txt{font-family:var(--f-body);font-size:.9rem}
.kv>div:last-child dt,.kv>div:last-child dd{border-bottom:0}
.kv>div.tot dt,.kv>div.tot dd{font-weight:700;background:var(--sunk)}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.chart svg{display:block;width:100%;max-width:620px;height:auto;margin:0 auto}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap;margin-top:6px;justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.toolbar{display:grid;gap:10px}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:44px}
.chips-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.82rem;font-weight:650;white-space:nowrap;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.ledger{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ledger .mh{padding:7px 12px;background:var(--sunk);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto 20px;gap:10px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.ledger li:last-child .row{border-bottom:0}
.r-date{display:grid;text-align:center;line-height:1.05}
.r-date b{font-family:var(--f-display);font-size:1.12rem;font-weight:720}
.r-date span{font-size:.66rem;color:var(--muted)}
.r-main{min-width:0}
.r-lib{font-weight:650;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-meta{font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-amt{font-family:var(--f-mono);font-weight:600;font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-seal svg{width:18px;height:18px;color:var(--ochre);display:block}
.r-seal.none svg{color:var(--muted);opacity:.55}
.row.rev .r-lib{text-decoration:line-through;text-decoration-color:var(--muted)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px;justify-items:start}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 16px;font-weight:650;font-size:.92rem;border:1px solid var(--line);background:var(--surface);min-height:44px;text-decoration:none;color:inherit}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.btn.seal{background:var(--ochre);border-color:var(--ochre);color:var(--on-indigo)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--indigo)}
.btn.danger{color:var(--neg);border-color:var(--neg);background:transparent}
.btn.wide{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--nav-h)}
.nav a{display:grid;justify-items:center;align-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.66rem;font-weight:650;min-width:0}
.nav a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--indigo)}
.fab{position:fixed;z-index:26;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));height:54px;border-radius:18px;padding:0 20px 0 16px;background:var(--ochre);color:var(--on-indigo);border:0;display:flex;align-items:center;gap:8px;font-weight:720;box-shadow:var(--shadow)}
.fab svg{width:22px;height:22px}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:calc(100% - 20px - env(safe-area-inset-top,0px));overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;align-content:start}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:90%}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.field{display:grid;gap:5px;min-width:0}
.field>label,.flabel{font-size:.8rem;font-weight:650;color:var(--muted)}
.in{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);min-height:44px}
textarea.in{min-height:74px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:430px){.grid2.stack{grid-template-columns:1fr}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:650;font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hint{font-size:.8rem;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-size:.9rem}
.check input{width:20px;height:20px;accent-color:var(--indigo);flex:none}
.smart{background:var(--indigo-soft);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.smart-h{display:flex;align-items:center;gap:8px;font-weight:720;font-size:.9rem;color:var(--indigo)}
.smart-h svg{width:18px;height:18px}
.status{font-size:.82rem;color:var(--muted);min-height:1.2em}
.confirm{border:1px solid var(--neg);background:var(--neg-soft);border-radius:12px;padding:12px;display:grid;gap:10px}

.fins{display:grid;gap:12px}
@media(min-width:760px){.fins{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fin{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0;align-content:start}
.fin-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.code{font-family:var(--f-mono);font-weight:600;font-size:.8rem;color:var(--indigo)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--indigo);border-radius:4px}
.bar.o>i{background:var(--ochre)} .bar.n>i{background:var(--neg)} .bar.p>i{background:var(--pos)}
.barrow{display:grid;gap:5px}
.barrow-l{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;color:var(--muted)}
.barrow-l b{font-family:var(--f-mono);color:var(--ink);font-weight:600}

.blist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:6px 12px;padding:12px;border-bottom:1px solid var(--line);align-items:center}
.brow:last-child{border-bottom:0}
.brow .bn{min-width:0}
.brow .bn b{display:block;font-size:.9rem}
.brow .bfoot{grid-column:1/-1;display:grid;gap:5px}
.bin{text-align:right;font-family:var(--f-mono);min-height:40px;padding:8px 10px}

.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:760px){.menu{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px;text-align:left;text-decoration:none;color:inherit;align-content:start}
.mitem svg{width:24px;height:24px;color:var(--indigo)}
.mitem b{font-size:.95rem}
.mitem span{font-size:.8rem;color:var(--muted)}

.chat{display:grid;gap:10px}
.msg{max-width:90%;padding:10px 13px;border-radius:14px;font-size:.92rem;overflow-wrap:anywhere}
.msg.u{justify-self:end;background:var(--indigo);color:var(--on-indigo);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.a{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.md p{margin:0 0 6px} .md p:last-child{margin:0}
.md ul,.md ol{margin:4px 0 8px;padding-left:20px}
.md h4{font-family:var(--f-display);font-size:.95rem;margin:10px 0 4px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:48px;max-height:150px}
.prop{border:1px solid var(--ochre);background:var(--ochre-soft);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;font-size:.92rem}
.url{font-family:var(--f-mono);font-size:.82rem;background:var(--sunk);padding:8px 10px;border-radius:8px;display:block;overflow-wrap:anywhere;user-select:all}

.lock{position:fixed;inset:0;z-index:60;background:var(--paper);overflow:auto;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lock-in{width:100%;max-width:390px;display:grid;gap:18px;justify-items:center;text-align:center}
.emblem{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--indigo);color:var(--on-indigo);position:relative;margin:8px 0}
.emblem::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1.5px dashed var(--ochre)}
.emblem svg{width:54px;height:54px}
.emblem.logo{background:none;width:120px;height:120px;margin:0}
.emblem.logo::after{display:none}
.emblem.logo svg{width:120px;height:120px}
.dots{display:flex;gap:12px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--indigo)}
.dots i.on{background:var(--indigo)}
.keypad{display:grid;grid-template-columns:repeat(3,74px);gap:12px;justify-content:center}
.key{height:60px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:1.4rem;font-weight:650;font-variant-numeric:tabular-nums}
.key.fn{font-family:var(--f-body);font-size:.82rem;color:var(--muted);font-weight:650}
.key.fn svg{width:24px;height:24px;color:var(--ochre)}
.err{color:var(--neg);font-size:.86rem;min-height:1.3em}
.feat{display:grid;gap:12px;text-align:left;width:100%;margin:0;padding:0;list-style:none}
.feat li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:.9rem}
.feat svg{width:24px;height:24px;color:var(--ochre)}
.steps{font-size:.72rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.form-left{display:grid;gap:12px;width:100%;text-align:left}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:650;width:max-content;max-width:min(92vw,520px);box-shadow:var(--shadow);text-align:center}
.hash{font-family:var(--f-mono);font-size:.74rem;word-break:break-all;color:var(--muted)}
.sealbox{border:1px dashed var(--ochre);background:var(--ochre-soft);border-radius:12px;padding:12px;display:grid;gap:6px}
.sealbox .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.88rem}
.sealbox .t svg{width:20px;height:20px;color:var(--ochre)}
.big-amt{font-family:var(--f-display);font-stretch:104%;font-weight:760;font-size:1.7rem;font-variant-numeric:tabular-nums}
.qa-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.idcard{background:var(--indigo);color:var(--on-indigo);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.idcard-top{display:flex;gap:12px;align-items:center}
.idcard-top svg{flex:none}
.idv{font-weight:600;font-size:1.02rem;letter-spacing:.04em;overflow-wrap:anywhere}
.idcard .chip{background:var(--surface)}
.idcard .btn:not(.seal){background:var(--surface);color:var(--ink);border-color:transparent}
.pk-row{display:flex;gap:8px;flex-wrap:wrap}
.pk{display:grid;background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;min-width:0}
.pk b{font-family:var(--f-mono);font-size:.92rem;font-variant-numeric:tabular-nums}
.pk span{font-size:.7rem;color:var(--muted)}
.qrbox{display:grid;place-items:center;background:#FFFFFF;border-radius:16px;padding:10px;border:1px solid var(--line)}
.qrbox canvas{width:100%;max-width:330px;height:auto;image-rendering:pixelated;display:block}
.scanv{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:16px;background:var(--ink)}
.sealbox.bad{border-color:var(--neg);background:var(--neg-soft)}
.sealbox.bad .t svg{color:var(--neg)}
.row.dem{grid-template-columns:40px minmax(0,1fr) auto auto}
.evrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:start}
.ledger li.evrow:last-child{border-bottom:0}
@media(max-width:759px){.mitem.span2{grid-column:1/-1}}
.pocket{display:grid;gap:6px}
.pocket-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pocket-h b{font-family:var(--f-display);font-stretch:112%;font-size:1.05rem}
.idline{display:grid;gap:2px}
details summary{cursor:pointer}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}

   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'

      setupPositionProbePattern(_moduleCount - 7, 0);

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )

          } else {
            _modules[row + r][col + c] = false;
          }

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              } else {
                _modules[row + r][col + c] = false;
              }

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {

        } else {

      for (var i = 0; i < rsBlocks.length; i += 1) {

          + buffer.getLengthInBits()

          + totalDataCount * 8

      // end code

        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);

      mode = mode || 'Byte';

      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

          for (var i = 0; i < rsBlocks.length; i++) {

      img += '"';
      img += '\u0020height="';

/* ================= Cryptographie ================= */
const enc = s => new TextEncoder().encode(s);
const b64e = u8 => { u8 = u8 instanceof Uint8Array ? u8 : new Uint8Array(u8); let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); };
const b64d = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
const b64url = u8 => b64e(u8).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64urlD = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return b64d(s); };
const hex = u8 => [...new Uint8Array(u8)].map(x => x.toString(16).padStart(2,'0')).join('');
const hexToU8 = h => new Uint8Array((h.match(/../g) || []).map(x => parseInt(x, 16)));
const concat = (a, b) => { const o = new Uint8Array(a.length + b.length); o.set(a, 0); o.set(b, a.length); return o; };
async function sha256(data){ return new Uint8Array(await crypto.subtle.digest('SHA-256', typeof data === 'string' ? enc(data) : data)); }
async function sha512(data){ return new Uint8Array(await crypto.subtle.digest('SHA-512', typeof data === 'string' ? enc(data) : data)); }
const qrStr = q => q ? Object.keys(q).sort().map(k => k + '=' + q[k]).join(',') : '';
/* Écritures v2 : chaîne SHA-512 et champ QR ; les écritures v1 (SHA-256) restent vérifiables */
function canon2(o){ return ['v2', o.prev || 'GENESE', o.n, o.date, o.piece || '', o.libelle || '', o.cat, o.sens, Math.round(+o.montant || 0), o.compte, o.mode || '', o.tiers || '', o.fin || '', o.justif ? 1 : 0, o.pj || '', o.rev || '', o.note || '', o.b || '', qrStr(o.qr), o.cur || '', o.fa ?? '', o.createdAt].join('|'); }
async function opHash(o){ return o.hv === 2 ? hex(await sha512(canon2(o))) : hex(await sha256(canon(o))); }
async function pbkdf2(pin, saltB64, iter){ const key = await crypto.subtle.importKey('raw', enc(pin), 'PBKDF2', false, ['deriveBits']); const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:b64d(saltB64), iterations:iter, hash:'SHA-256'}, key, 256); return b64e(new Uint8Array(bits)); }
function canon(o){ return [o.prev || 'GENESE', o.n, o.date, o.piece || '', o.libelle || '', o.cat, o.sens, Math.round(+o.montant || 0), o.compte, o.mode || '', o.tiers || '', o.fin || '', o.justif ? 1 : 0, o.pj || '', o.rev || '', o.note || '', o.b || '', o.createdAt].join('|'); }
function derToRaw(der){
  let i = 2; if (der[1] & 0x80) i = 2 + (der[1] & 0x7f);
  i++; const rl = der[i++]; let r = der.slice(i, i + rl); i += rl;
  i++; const sl = der[i++]; let s = der.slice(i, i + sl);
  const fix = x => { while (x.length > 32 && x[0] === 0) x = x.slice(1); const o = new Uint8Array(32); o.set(x, 32 - x.length); return o; };
  const out = new Uint8Array(64); out.set(fix(r), 0); out.set(fix(s), 32); return out;
}

const BIO = { supported: !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create), platform: null, blocked: false };
async function bioCheck(){
  if (!BIO.supported){ BIO.platform = false; return; }
  try { BIO.platform = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch { BIO.platform = false; }
}
function bioErr(e){
  const m = String(e?.message || '');
  if (/feature|permissions? policy|not enabled|publickey-credentials|cross-origin|origin/i.test(m) || e?.name === 'SecurityError') return 'bloque';
  if (e?.name === 'NotAllowedError' || e?.name === 'AbortError') return 'annule';
  if (e?.name === 'InvalidStateError') return 'existe';
  if (e?.name === 'NotSupportedError') return 'nonsupporte';
  return 'erreur';
}
function bioMsg(kind){
  return ({
    bloque:'Cette fenêtre bloque l’accès au capteur d’empreinte (cadre sécurisé). Utilisez l’application installée, ouverte en HTTPS, pour l’empreinte ; le code PIN protège le registre en attendant.',
    annule:'Lecture de l’empreinte annulée ou expirée.',
    existe:'Une empreinte est déjà enregistrée pour ce registre sur cet appareil.',
    nonsupporte:'Cet appareil ne propose pas de capteur biométrique compatible.',
    erreur:'Le capteur biométrique n’a pas répondu. Réessayez.'
  })[kind] || 'Erreur biométrique.';
}
const bioUsable = () => BIO.supported && BIO.platform !== false && !BIO.blocked && DEV.credIds.length > 0;
const bioSignOn = () => bioUsable() && DEV.signBio && !S.demo;
function deviceLabel(){ const ua = navigator.userAgent; if (/Android/i.test(ua)) return 'Android'; if (/iPhone|iPad/i.test(ua)) return 'iPhone / iPad'; if (/Mac/i.test(ua)) return 'Mac'; if (/Windows/i.test(ua)) return 'Windows'; return 'Appareil'; }
async function bioEnroll(){
  const uid = crypto.getRandomValues(new Uint8Array(16));
  const cred = await navigator.credentials.create({publicKey:{
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    rp: {name:'Registre financier scellé'},
    user: {id:uid, name:'registre-' + b64url(uid).slice(0,8), displayName: D().settings.structure || 'Registre financier'},
    pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
    authenticatorSelection: {authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged'},
    timeout: 60000, attestation: 'none'
  }});
  const id = b64url(new Uint8Array(cred.rawId));
  let pk = null, alg = -7;
  try { const p = cred.response.getPublicKey && cred.response.getPublicKey(); if (p) pk = b64e(new Uint8Array(p)); if (cred.response.getPublicKeyAlgorithm) alg = cred.response.getPublicKeyAlgorithm(); } catch {}
  return {id, pk, alg, at:new Date().toISOString(), label:deviceLabel()};
}
async function bioAssert(challenge){
  const a = await navigator.credentials.get({publicKey:{
    challenge, userVerification:'required', timeout:60000,
    allowCredentials: DEV.credIds.map(id => ({type:'public-key', id:b64urlD(id)}))
  }});
  const ad = new Uint8Array(a.response.authenticatorData);
  if (!(ad[32] & 0x04)) { const e = new Error('Vérification biométrique absente'); e.name = 'NotAllowedError'; throw e; }
  return {credId:b64url(new Uint8Array(a.rawId)), ad:b64e(ad), cd:b64e(new Uint8Array(a.response.clientDataJSON)), sig:b64e(new Uint8Array(a.response.signature))};
}
async function verifySig(op, cred){
  if (!op.sig || !cred || !cred.pk) return null;
  try {
    const cd = b64d(op.sig.cd); const j = JSON.parse(new TextDecoder().decode(cd));
    if (j.type !== 'webauthn.get' || j.challenge !== b64url(hexToU8(op.hash))) return false;
    const ad = b64d(op.sig.ad); if (!(ad[32] & 0x04)) return false;
    const data = concat(ad, await sha256(cd)); const sig = b64d(op.sig.sig);
    if (cred.alg === -257){ const k = await crypto.subtle.importKey('spki', b64d(cred.pk), {name:'RSASSA-PKCS1-v1_5', hash:'SHA-256'}, false, ['verify']); return await crypto.subtle.verify('RSASSA-PKCS1-v1_5', k, sig, data); }
    const k = await crypto.subtle.importKey('spki', b64d(cred.pk), {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
    return await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, k, derToRaw(sig), data);
  } catch { return false; }
}

function loanInfo(f, F){
  const P = num(f.montant), n = Math.round(num(f.duree)), r = num(f.taux) / 100 / 12;
  if (!f.remb || P <= 0 || n <= 0) return null;
  const pmt = r > 0 ? P * r / (1 - Math.pow(1 + r, -n)) : P / n;
  const rows = []; let cap = P, cum = 0;
  for (let k = 1; k <= n; k++){ const it = cap * r, pr = pmt - it, end = Math.max(cap - pr, 0); cum += pr; rows.push({k, date: isoValid(f.debut) ? addMonths(f.debut, k-1) : '', cap, it, pr, pmt, end, cum}); cap = end; }
  const t = todayISO(); const due = rows.filter(x => x.date && x.date <= t);
  const expCap = due.length ? due[due.length-1].cum : 0;
  const next = rows.find(x => x.date && x.date > t) || null;
  const late = !!F && F.recu > 0 && (F.capRemb + 1) < (expCap - pmt * 0.02);
  return {pmt, rows, expCap, dueCount:due.length, next, late, cout:pmt*n - P};
}
function compute(){
  const d = D(), st = d.settings, y = +st.exercice || new Date().getFullYear();
  const y0 = `${y}-01-01`, y1 = `${y}-12-31`;
  const C = {y, acc:{}, months:Array.from({length:12}, () => ({e:0, s:0})), tft:{Exploitation:{e:0,s:0}, Investissement:{e:0,s:0}, Financement:{e:0,s:0}}, cat:{}, fin:{}, enc:0, dec:0, nOps:d.ops.length};
  ACCS.forEach(a => { C.acc[a.k] = {ouv:num(st.soldes?.[a.k]), e:0, s:0}; });
  C.reversed = new Set(d.ops.filter(o => o.rev).map(o => o.rev));
  for (const o of d.ops){
    const m = +o.montant || 0, c = catOf(o.cat), A = C.acc[o.compte];
    if (A){ if (o.sens === 'E') A.e += m; else A.s += m; }
    if (o.date >= y0 && o.date <= y1 && c.f !== 'Interne'){
      const mi = +o.date.slice(5,7) - 1;
      if (o.sens === 'E'){ C.enc += m; C.months[mi].e += m; if (C.tft[c.f]) C.tft[c.f].e += m; }
      else { C.dec += m; C.months[mi].s += m; if (C.tft[c.f]) C.tft[c.f].s += m; }
      C.cat[c.k] = (C.cat[c.k] || 0) + (((c.s === 'E') === (o.sens === 'E')) ? m : -m);
    }
  }
  C.soldeOuv = 0; C.solde = 0;
  ACCS.forEach(a => { const x = C.acc[a.k]; x.solde = x.ouv + x.e - x.s; C.soldeOuv += x.ouv; C.solde += x.solde; });
  let run = C.soldeOuv; C.months.forEach(mo => { mo.deb = run; run += mo.e - mo.s; mo.fin = run; });
  for (const f of d.fins){
    const F = {recu:0, utilise:0, capRemb:0, interets:0, n:0};
    for (const o of d.ops){
      if (o.fin !== f.code) continue; F.n++;
      const c = catOf(o.cat), m = +o.montant || 0, sg = o.sens === 'E' ? 1 : -1;
      if (c.k === 'remb_capital') F.capRemb -= sg * m;
      else if (c.k === 'interets') F.interets -= sg * m;
      else if (c.s === 'E') F.recu += sg * m;
      else if (c.s === 'S' && (c.f === 'Exploitation' || c.f === 'Investissement')) F.utilise -= sg * m;
    }
    F.dispo = F.recu - F.utilise; F.reste = Math.max(num(f.montant) - F.recu, 0);
    F.loan = loanInfo(f, F); F.restantDu = f.remb ? Math.max(F.recu - F.capRemb, 0) : 0;
    C.fin[f.code] = F;
  }
  C.finTot = d.fins.reduce((t, f) => { const F = C.fin[f.code]; t.accorde += num(f.montant); t.recu += F.recu; t.utilise += F.utilise; t.dispo += F.dispo; t.du += F.restantDu; t.pmt += (F.loan && f.statut !== 'Soldé') ? F.loan.pmt : 0; return t; }, {accorde:0, recu:0, utilise:0, dispo:0, du:0, pmt:0});
  return C;
}

  const o2 = {crit:0, warn:1, info:2}; A.sort((a, b) => o2[a.lvl] - o2[b.lvl]);

let verifyTimer = null, verifySeq = 0;
function scheduleVerify(){ clearTimeout(verifyTimer); verifyTimer = setTimeout(verifyAll, 250); }
async function verifyAll(){
  const seq = ++verifySeq, d = D(), ops = [...d.ops].sort((a, b) => a.n - b.n);
  const broken = [], sigRes = {}; let prev = 'GENESE';
  for (let i = 0; i < ops.length; i++){
    const o = ops[i];
    if (o.n !== i + 1) broken.push({n:o.n, why:'numérotation discontinue'});
    if (o.prev !== prev) broken.push({n:o.n, why:'lien avec l’écriture précédente rompu'});
    let h = ''; try { h = await opHash(o); } catch {}
    if (h !== o.hash) broken.push({n:o.n, why:'contenu modifié après scellement'});
    prev = o.hash;
    if (o.sig){ const cred = d.creds.find(c => c.id === o.sig.credId); sigRes[o.b || o.id] = await verifySig(o, cred); }
  }
  if (seq !== verifySeq) return;
  let signed = 0, verified = 0;
  ops.forEach(o => { const r = sigRes[o.b || o.id]; if (r === undefined) return; signed++; if (r === true) verified++; if (r === false && o.sig) broken.push({n:o.n, why:'signature biométrique invalide'}); });
  let pq = null; const seal = (d.seals || []).slice(-1)[0];
  if (seal){
    const op = ops.find(o => o.n === seal.n), key = (d.pqkeys || []).find(k => k.kid === seal.kid);
    if (!op || op.hash !== seal.hash){ pq = {ok:false, n:seal.n}; broken.push({n:seal.n, why:'le sceau post-quantique ne correspond plus à la chaîne'}); }
    else if (!key || !window.NoblePQ) pq = {ok:null, n:seal.n, at:seal.at};
    else { let v = false; try { v = NoblePQ.ml_dsa65.verify(b64d(key.pk), enc(`RFS-SEAL|${seal.n}|${seal.hash}`), b64d(seal.sig)); } catch {} pq = {ok:v, n:seal.n, at:seal.at, kid:seal.kid}; if (!v) broken.push({n:seal.n, why:'sceau post-quantique invalide'}); }
    pq.after = ops.filter(o => o.n > seal.n).length;
  }
  S.integrity = {ok:broken.length === 0, broken, total:ops.length, signed, verified, pq, v2:ops.filter(o => o.hv === 2).length, at:new Date()};
  refresh();
}

/* ================= Moteur autonome local (analyse du texte) ================= */
function parseAmount(raw){
  let s = String(raw).replace(/[  ]/g, ' ');
  s = s.replace(/\b\d{1,2}[\/.\-]\d{1,2}(?:[\/.\-]\d{2,4})?\b/g, ' ').replace(/\b(pj|fin|n°|no)[\s\-]*\d+/gi, ' ');
  const re = /(\d{1,3}(?:[ .]\d{3})+|\d+(?:[.,]\d+)?)\s*(millions?|mille|k|m)?(?![a-zà-ÿ])/gi;
  const cand = []; let mt;
  while ((mt = re.exec(s))){
    const tok = mt[1]; let v = /[ .]\d{3}/.test(tok) && !/[.,]\d{1,2}$/.test(tok) ? parseFloat(tok.replace(/[ .]/g, '')) : parseFloat(tok.replace(',', '.'));
    const mu = (mt[2] || '').toLowerCase();
    if (mu === 'k' || mu === 'mille') v *= 1000; else if (mu === 'm' || mu.startsWith('million')) v *= 1e6;
    cand.push({v, year: !mu && /^(19|20)\d{2}$/.test(tok)});
  }
  const pool = cand.some(c => !c.year) ? cand.filter(c => !c.year) : cand;
  return Math.round(pool.reduce((m, c) => Math.max(m, c.v), 0));
}
function kwHit(t, kw){ const k = norm(kw); const i = t.indexOf(k); if (i < 0) return false; const before = i === 0 ? ' ' : t[i-1]; return !/[a-z0-9]/.test(before) && (k.length > 3 || !/[a-z0-9]/.test(t[i + k.length] || ' ')); }
function localParse(text){
  const t = norm(text), r = {};
  r.montant = parseAmount(text);
  const today = todayISO();
  if (/avant hier/.test(t)) r.date = addDays(today, -2);
  else if (/\bhier\b/.test(t)) r.date = addDays(today, -1);

/* Moteur antifraude */
function assessRisk(kind, amount, res, ref, cur){
  const d = D(), R = [], now = Date.now(); let level = 'ok';
  const bump = l => { if (l === 'block' || (l === 'warn' && level === 'ok')) level = l; };
  if (d.settings.block){ R.push('Blocage d’urgence actif.'); bump('block'); }
  if (res && !res.ok){ R.push('Signature invalide : le QR a été falsifié ou modifié.'); bump('block'); }
  if (res?.data?.e && now / 1000 > res.data.e){ R.push('QR expiré : demandez un nouveau QR au bénéficiaire.'); bump('block'); }
  if (kind === 'pay' && ref && d.ops.some(o => o.qr && o.qr.ref === ref && o.sens === 'S')){ R.push(`La référence ${ref} a déjà été payée : double paiement bloqué.`); bump('block'); }
  if (kind === 'receive'){
    if (res?.data?.to !== myId()){ R.push('Ce reçu n’est pas destiné à ce portefeuille.'); bump('block'); }
    if ((d.used || []).includes(ref) || d.ops.some(o => o.qr && o.qr.ref === ref && o.sens === 'E')){ R.push(`Le reçu ${ref} a déjà été encaissé : double encaissement bloqué.`); bump('block'); }
    const dem = (d.demandes || []).find(q => q.ref === ref);
    if (dem && Math.round(dem.c === 'XOF' ? dem.a : dem.fa * 100) !== Math.round(dem.c === 'XOF' ? amount : amount * 100)){ R.push('Le montant du reçu diffère de la demande.'); bump('warn'); }
  }
  if (kind === 'pay'){
    const c = cur || 'XOF', p = pockets().find(x => x.c === c);
    if (!p || p.avail < amount) { R.push(`Solde disponible en ${c} insuffisant dans le registre (${fmtCur(p ? p.avail : 0, c)}).`); bump('warn'); }
    if (res?.own){ R.push('Ce QR a été émis par votre propre portefeuille.'); bump('warn'); }
    const xof = c === 'XOF' ? amount : amount * (rateOf(c) || 0);
    const outs = d.ops.filter(o => o.qr && o.sens === 'S').map(o => o.montant).sort((a, b) => a - b), med = outs.length ? outs[Math.floor(outs.length / 2)] : 0, lim = num(d.settings.fraudMax) || 500000;
    if (xof > lim){ R.push(`Montant supérieur au plafond de vigilance (${fmt(lim)} F CFA).`); bump('warn'); }
    else if (outs.length >= 5 && xof > 3 * med){ R.push(`Montant inhabituel : plus de 3 fois votre paiement QR médian (${fmt(med)} F CFA).`); bump('warn'); }
    const recent = d.ops.filter(o => o.qr && o.sens === 'S' && now - Date.parse(o.createdAt) < 600000).length;
    if (recent >= 5){ R.push(`${recent} paiements QR en moins de 10 minutes.`); bump('warn'); }
    if (res?.ok && !res.known && !d.ops.some(o => o.qr && o.qr.cp === res.id) && xof >= 200000){ R.push('Premier paiement vers ce bénéficiaire pour un montant élevé : vérifiez son identifiant TFS.'); bump('warn'); }
  }
  return {level, reasons:R};
}

async function lockPin(k){

    case 'anchor-save': { const tx = $('#anc_tx', sh).value.trim(); if (tx.length < 8){ $('#anc_err', sh).textContent = 'Collez l’identifiant de la transaction.'; break; } const d = D(), net = $('#anc_net', sh).value; d.anchors = (d.anchors || []).concat([{n:+ds.n, h:ds.h, net, tx:tx.slice(0, 140), at:new Date().toISOString()}]).slice(-200); logEvent('ancrage', `${net} · écriture n° ${ds.n} · ${tx.slice(0, 24)}`); toast('Ancrage enregistré.'); openLedger(); break; }
    case 'ob-start': OB.step = 'pin1'; OB.buf = ''; renderLock(); break;
    case 'ob-bio': { const r = await enrollBio(); renderLock(r.ok ? '' : r.msg); break; }
    case 'ob-next': obAfterBio(); break;
    case 'ob-finish': obFinish(); break;
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'q'){ S.jq = ev.target.value; const box = $('#ledgerBox'); if (box) box.innerHTML = ledgerHTML(compute()); }
});
document.addEventListener('change', ev => {
  const t = ev.target, d = D();
  if (t.dataset.bud){ const v = Math.round(num(t.value)); if (v) d.budget[t.dataset.bud] = v; else delete d.budget[t.dataset.bud]; t.value = v ? fmt(v) : ''; Store.saveMeta(); return; }
  if (t.dataset.set){ const k = t.dataset.set; if (k.startsWith('soldes.')){ const v = Math.round(num(t.value)); d.settings.soldes[k.slice(7)] = v; t.value = fmt(v); } else if (k === 'exercice') d.settings.exercice = +t.value; else d.settings[k] = t.value.trim(); Store.saveMeta(); return; }
  if (t.dataset.setlim){ const v = Math.round(num(t.value)); if (v > 0){ d.settings.fraudMax = v; t.value = fmt(v); Store.saveMeta(); toast('Plafond de vigilance enregistré.'); } return; }
  if (t.dataset.dev){ if (t.dataset.dev === 'signBio') DEV.signBio = t.checked; if (t.dataset.dev === 'autoLock') DEV.autoLock = +t.value; saveDev(); toast('Préférence enregistrée.'); return; }
  if (t.id === 'restore' && t.files?.[0]) restoreJson(t.files[0]);
});
document.addEventListener('focusout', () => { setTimeout(() => { const ae = document.activeElement; if (S.deferRender && !($('#main').contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae?.tagName))) render(); }, 0); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.sheet){ closeSheet(); return; }
  if (!$('#lock').hidden && (S.lockMode === 'unlock' || OB.step === 'pin1' || OB.step === 'pin2') && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')){
    if (/^\d$/.test(ev.key)){ S.lockMode === 'onboard' ? obPin(ev.key) : lockPin(ev.key); }
    else if (ev.key === 'Backspace'){ S.lockMode === 'onboard' ? obPin('del') : lockPin('del'); }
  }
  if (ev.key === 'Enter' && ev.target.id === 'ask' && !ev.shiftKey){ ev.preventDefault(); sendChat(ev.target.value); }
});
window.addEventListener('hashchange', () => { S.view = viewFromHash(); closeSheet(); render(); window.scrollTo(0, 0); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; refresh(); });

/* ================= Démarrage ================= */
(async function boot(){
  if (!window.crypto || !crypto.subtle){
    $('#lock').innerHTML = `<div class="lock-in"><div class="emblem">${ic('shield')}</div><h1>Connexion non sécurisée</h1><p class="muted">Ouvrez l’application depuis une adresse HTTPS : le chiffrement et l’empreinte digitale l’exigent.</p></div>`; return;
  }
  Store.init(); S.view = viewFromHash();
  await bioCheck();
  Store.start(); AI.init(); initKeys();
  Store.ready.then(() => setTimeout(syncDeviceCred, 600));
  if (!STORAGE_OK){ S.lockMode = 'unlock'; unlock(); }
  else if (!DEV.pin){ S.lockMode = 'onboard'; OB.step = 'intro'; renderLock(); }
  else { S.lockMode = 'unlock'; renderLock(); }
  if ('serviceWorker' in navigator && !ENV.inClaude && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
